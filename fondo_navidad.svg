<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <style>
      .xmas-icon {
        fill: none;
        stroke: rgba(255, 255, 255, 0.18);
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .xmas-fill {
        fill: rgba(255, 255, 255, 0.18);
        stroke: none;
      }
      .xmas-subtle {
        fill: none;
        stroke: rgba(255, 255, 255, 0.12);
        stroke-width: 1.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- ==================== FILA 1 (Y ~ 40 - 70) ==================== -->
  
  <!-- 1. COPO DE NIEVE CRISTALINO (45, 55) -->
  <g class="xmas-icon" transform="translate(45, 55)">
    <line x1="0" y1="-22" x2="0" y2="22"/>
    <line x1="-19" y1="-11" x2="19" y2="11"/>
    <line x1="-19" y1="11" x2="19" y2="-11"/>
    <!-- Detalles en ramas -->
    <path d="M -5 -16 L 0 -22 L 5 -16"/>
    <path d="M -5 16 L 0 22 L 5 16"/>
    <path d="M -16 -6 L -19 -11 L -12 -13"/>
    <path d="M 16 6 L 19 11 L 12 13"/>
    <path d="M -16 6 L -19 11 L -12 13"/>
    <path d="M 16 -6 L 19 -11 L 12 -13"/>
    <circle cx="0" cy="0" r="3.5" class="xmas-subtle"/>
  </g>

  <!-- DESTELLO ESTRELLA 4 PUNTAS (115, 35) -->
  <path class="xmas-icon" d="M 115 25 Q 115 35 105 35 Q 115 35 115 45 Q 115 35 125 35 Q 115 35 115 25 Z"/>

  <!-- 2. PINO NAVIDEÑO CON ESTRELLA (175, 55) -->
  <g class="xmas-icon" transform="translate(175, 55)">
    <!-- Estrella -->
    <polygon points="0,-25 2.5,-19 9,-19 4,-15 6,-9 0,-13 -6,-9 -4,-15 -9,-19 -2.5,-19" class="xmas-fill"/>
    <!-- Niveles -->
    <path d="M -4 -17 L -10 -9 L -6 -9 L -14 -1 L -9 -1 L -18 8 L 18 8 L 9 -1 L 14 -1 L 6 -9 L 10 -9 L 4 -17 Z"/>
    <!-- Tronco -->
    <rect x="-3" y="8" width="6" height="6" rx="1"/>
    <!-- Guirnalda -->
    <path d="M -6 -5 Q 0 -2 6 -5" class="xmas-subtle"/>
    <path d="M -10 3 Q 0 7 10 3" class="xmas-subtle"/>
  </g>

  <!-- PUNTOS DE NIEVE (235, 40) -->
  <circle cx="235" cy="40" r="2.2" class="xmas-fill"/>
  <circle cx="250" cy="65" r="1.5" class="xmas-fill"/>

  <!-- 3. CAMPANA NAVIDEÑA CON LAZO (310, 55) -->
  <g class="xmas-icon" transform="translate(310, 55)">
    <!-- Lazo arriba -->
    <circle cx="0" cy="-17" r="2.5" class="xmas-fill"/>
    <path d="M -2 -17 C -8 -23 -11 -15 -2 -17 Z"/>
    <path d="M 2 -17 C 8 -23 11 -15 2 -17 Z"/>
    <!-- Cuerpo campana -->
    <path d="M -4 -14 C -12 -12 -14 3 -16 8 C -16 11 16 11 16 8 C 14 3 12 -12 4 -14 Z"/>
    <!-- Badajo -->
    <path d="M -3 11 C -3 15 3 15 3 11"/>
    <!-- Línea decorativa -->
    <path d="M -12 4 Q 0 7 12 4" class="xmas-subtle"/>
  </g>

  <!-- ESTRELLA PEQUEÑA (370, 45) -->
  <polygon points="370,38 372,43 377,43 373,46 375,51 370,48 365,51 367,46 363,43 368,43" class="xmas-fill"/>


  <!-- ==================== FILA 2 (Y ~ 125 - 165) ==================== -->

  <!-- 4. GUANTE / MITTEN DE INVIERNO (70, 140) -->
  <g class="xmas-icon" transform="translate(70, 140)">
    <!-- Puño con textura -->
    <rect x="-11" y="9" width="22" height="7" rx="3.5"/>
    <line x1="-6" y1="11" x2="-6" y2="14" class="xmas-subtle"/>
    <line x1="0" y1="11" x2="0" y2="14" class="xmas-subtle"/>
    <line x1="6" y1="11" x2="6" y2="14" class="xmas-subtle"/>
    <!-- Mano y pulgar -->
    <path d="M -10 9 C -11 0 -9 -14 0 -15 C 8 -15 11 -4 10 9 Z"/>
    <path d="M -10 4 C -16 3 -16 -4 -11 -5 C -8 -5 -8 0 -9 4"/>
    <!-- Copito decorativo en el centro -->
    <line x1="0" y1="-7" x2="0" y2="-1" class="xmas-subtle"/>
    <line x1="-3" y1="-4" x2="3" y2="-4" class="xmas-subtle"/>
  </g>

  <!-- ESTRELLA 4 PUNTAS (135, 120) -->
  <path class="xmas-icon" d="M 135 110 Q 135 120 125 120 Q 135 120 135 130 Q 135 120 145 120 Q 135 120 135 110 Z"/>

  <!-- 5. BAMBALINA / ESFERA COLGANTE (210, 145) -->
  <g class="xmas-icon" transform="translate(210, 145)">
    <!-- Cinta / anillo colgante -->
    <line x1="0" y1="-24" x2="0" y2="-17"/>
    <rect x="-4" y="-17" width="8" height="4" rx="1"/>
    <!-- Esfera -->
    <circle cx="0" cy="0" r="15"/>
    <!-- Franjas zig-zag navideñas -->
    <path d="M -14 -3 Q 0 -6 14 -3" class="xmas-subtle"/>
    <path d="M -14 3 Q 0 6 14 3" class="xmas-subtle"/>
    <circle cx="0" cy="0" r="2" class="xmas-fill"/>
  </g>

  <!-- COPO MINI (285, 125) -->
  <g class="xmas-icon" transform="translate(285, 125)">
    <line x1="0" y1="-9" x2="0" y2="9"/>
    <line x1="-8" y1="-4.5" x2="8" y2="4.5"/>
    <line x1="-8" y1="4.5" x2="8" y2="-4.5"/>
    <circle cx="0" cy="0" r="1.5" class="xmas-fill"/>
  </g>

  <!-- 6. BASTÓN DE CARAMELO (350, 145) -->
  <g class="xmas-icon" transform="translate(350, 145)">
    <!-- Curva del bastón -->
    <path d="M 8 18 L 8 -7 C 8 -17 -8 -17 -8 -7 L -8 -3" stroke-width="4.5"/>
    <!-- Rayas diagonales -->
    <line x1="5" y1="12" x2="11" y2="15" stroke="rgba(15,23,42,0.9)" stroke-width="2.5"/>
    <line x1="5" y1="4" x2="11" y2="7" stroke="rgba(15,23,42,0.9)" stroke-width="2.5"/>
    <line x1="5" y1="-4" x2="11" y2="-1" stroke="rgba(15,23,42,0.9)" stroke-width="2.5"/>
    <line x1="-11" y1="-7" x2="-5" y2="-4" stroke="rgba(15,23,42,0.9)" stroke-width="2.5"/>
  </g>


  <!-- ==================== FILA 3 (Y ~ 215 - 255) ==================== -->

  <!-- 7. CAJA DE REGALO CON LAZO (55, 235) -->
  <g class="xmas-icon" transform="translate(55, 235)">
    <!-- Lazo arriba -->
    <path d="M 0 -13 C -7 -20 -12 -12 0 -13 Z"/>
    <path d="M 0 -13 C 7 -20 12 -12 0 -13 Z"/>
    <circle cx="0" cy="-13" r="1.8" class="xmas-fill"/>
    <!-- Tapa -->
    <rect x="-15" y="-12" width="30" height="6" rx="1.5"/>
    <!-- Cuerpo caja -->
    <rect x="-13" y="-6" width="26" height="20" rx="1.5"/>
    <!-- Cinta vertical -->
    <line x1="0" y1="-12" x2="0" y2="14"/>
    <!-- Cinta horizontal -->
    <line x1="-13" y1="4" x2="13" y2="4"/>
  </g>

  <!-- PUNTITOS DE NIEVE (115, 220) -->
  <circle cx="115" cy="220" r="2" class="xmas-fill"/>
  <circle cx="130" cy="245" r="1.3" class="xmas-fill"/>

  <!-- 8. HOMBRECILLO DE JENGIBRE (180, 235) -->
  <g class="xmas-icon" transform="translate(180, 235)">
    <!-- Cabeza -->
    <circle cx="0" cy="-15" r="7"/>
    <!-- Ojos y sonrisa -->
    <circle cx="-2.5" cy="-16" r="0.8" class="xmas-fill"/>
    <circle cx="2.5" cy="-16" r="0.8" class="xmas-fill"/>
    <path d="M -2 -13 Q 0 -11 2 -13" class="xmas-subtle"/>
    <!-- Brazos y piernas -->
    <path d="M -6 -8 C -16 -6 -15 2 -8 0 L -6 7 C -6 16 -13 14 -12 21 C -11 23 -5 21 -4 14 L 0 9 L 4 14 C 5 21 11 23 12 21 C 13 14 6 16 6 7 L 8 0 C 15 2 16 -6 6 -8 Z"/>
    <!-- Botones -->
    <circle cx="0" cy="-3" r="1.2" class="xmas-fill"/>
    <circle cx="0" cy="3" r="1.2" class="xmas-fill"/>
  </g>

  <!-- DESTELLO ESTRELLA 4 PUNTAS (245, 220) -->
  <path class="xmas-icon" d="M 245 210 Q 245 220 235 220 Q 245 220 245 230 Q 245 220 255 220 Q 245 220 245 210 Z"/>

  <!-- 9. HOJAS DE ACEBO CON FRUTOS ROJOS (315, 235) -->
  <g class="xmas-icon" transform="translate(315, 235)">
    <!-- Hojita izquierda -->
    <path d="M -3 -3 C -10 -8 -8 -17 -16 -18 C -16 -10 -23 -8 -20 2 C -12 2 -9 9 -3 -3 Z"/>
    <!-- Hojita derecha -->
    <path d="M 3 -3 C 10 -8 8 -17 16 -18 C 16 -10 23 -8 20 2 C 12 2 9 9 3 -3 Z"/>
    <!-- 3 Frutillas/Bayas -->
    <circle cx="-3" cy="2" r="3.2" class="xmas-fill"/>
    <circle cx="3" cy="2" r="3.2" class="xmas-fill"/>
    <circle cx="0" cy="-3" r="3.2" class="xmas-fill"/>
  </g>

  <!-- PUNTITO (380, 230) -->
  <circle cx="380" cy="230" r="1.8" class="xmas-fill"/>


  <!-- ==================== FILA 4 (Y ~ 305 - 345) ==================== -->

  <!-- 10. BOTA / CALCETÍN NAVIDEÑO (65, 325) -->
  <g class="xmas-icon" transform="translate(65, 325)">
    <!-- Borde superior acolchado -->
    <rect x="-10" y="-18" width="20" height="7" rx="3.5"/>
    <line x1="-5" y1="-16" x2="-5" y2="-13" class="xmas-subtle"/>
    <line x1="0" y1="-16" x2="0" y2="-13" class="xmas-subtle"/>
    <line x1="5" y1="-16" x2="5" y2="-13" class="xmas-subtle"/>
    <!-- Cuerpo y pie de la bota -->
    <path d="M -8 -11 L -8 4 C -8 11 -18 10 -18 16 C -18 21 -10 21 -5 21 C 5 21 8 13 8 4 L 8 -11 Z"/>
    <!-- Puntera y talón -->
    <path d="M -18 16 C -15 16 -13 18 -13 21" class="xmas-subtle"/>
    <path d="M 8 10 C 5 10 3 13 3 15" class="xmas-subtle"/>
  </g>

  <!-- COPO DE NIEVE 6 PUNTAS (140, 325) -->
  <g class="xmas-icon" transform="translate(140, 325)">
    <line x1="0" y1="-15" x2="0" y2="15"/>
    <line x1="-13" y1="-7.5" x2="13" y2="7.5"/>
    <line x1="-13" y1="7.5" x2="13" y2="-7.5"/>
    <path d="M -3 -11 L 0 -15 L 3 -11"/>
    <path d="M -3 11 L 0 15 L 3 11"/>
    <path d="M -11 -4 L -13 -7.5 L -8 -8.5"/>
    <path d="M 11 4 L 13 7.5 L 8 8.5"/>
    <path d="M -11 4 L -13 7.5 L -8 8.5"/>
    <path d="M 11 -4 L 13 -7.5 L 8 -8.5"/>
    <circle cx="0" cy="0" r="2.2" class="xmas-fill"/>
  </g>

  <!-- 11. VELA NAVIDEÑA CON LLAMA (215, 325) -->
  <g class="xmas-icon" transform="translate(215, 325)">
    <!-- Base / platillo -->
    <ellipse cx="0" cy="14" rx="14" ry="4"/>
    <path d="M 12 14 C 18 14 18 8 12 8"/>
    <!-- Cilindro vela -->
    <rect x="-6" y="-3" width="12" height="16" rx="1.5"/>
    <!-- Mecha -->
    <line x1="0" y1="-3" x2="0" y2="-7"/>
    <!-- Llama brillante -->
    <path d="M 0 -17 C -3 -13 -3 -9 0 -7 C 3 -9 3 -13 0 -17 Z" class="xmas-fill"/>
  </g>

  <!-- DESTELLO DIAMANTE (280, 315) -->
  <polygon points="280,305 284,315 280,325 276,315" class="xmas-fill"/>
  <circle cx="265" cy="340" r="1.6" class="xmas-fill"/>

  <!-- 12. CORONA NAVIDEÑA CON LAZO (340, 325) -->
  <g class="xmas-icon" transform="translate(340, 325)">
    <!-- Anillo corona -->
    <circle cx="0" cy="0" r="14"/>
    <circle cx="0" cy="0" r="7"/>
    <!-- Hojitas alrededor -->
    <circle cx="-11" cy="-7" r="1.8" class="xmas-fill"/>
    <circle cx="11" cy="-7" r="1.8" class="xmas-fill"/>
    <circle cx="-11" cy="7" r="1.8" class="xmas-fill"/>
    <circle cx="11" cy="7" r="1.8" class="xmas-fill"/>
    <circle cx="0" cy="13" r="1.8" class="xmas-fill"/>
    <!-- Lazo arriba -->
    <circle cx="0" cy="-14" r="2" class="xmas-fill"/>
    <path d="M 0 -14 C -6 -20 -9 -13 0 -14 Z"/>
    <path d="M 0 -14 C 6 -20 9 -13 0 -14 Z"/>
  </g>

  <!-- PUNTOS Y ESTRELLITAS DE CIERRE DE PATRÓN -->
  <circle cx="15" cy="190" r="1.8" class="xmas-fill"/>
  <circle cx="390" cy="190" r="1.8" class="xmas-fill"/>
  <circle cx="20" cy="380" r="2.2" class="xmas-fill"/>
  <circle cx="380" cy="380" r="2.2" class="xmas-fill"/>
  <polygon points="100,380 102,385 107,385 103,388 105,393 100,390 95,393 97,388 93,385 98,385" class="xmas-fill"/>
  <polygon points="300,380 302,385 307,385 303,388 305,393 300,390 295,393 297,388 293,385 298,385" class="xmas-fill"/>
</svg>